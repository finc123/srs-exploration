<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Web Traffic Tracker</title>
<!-- Fallback only (theme.css unreachable). Declared first, in a lower cascade layer, so theme.css always wins. -->
<style>
@layer srs-fallback{
:root{--bg:#f2f2f7;--card:#fff;--line:#e5e5ea;--text:#1d1d1f;--muted:#6e6e73;--accent:#0066cc;--hl:#e8f1ff;--hover:#f5f5f7;
 --up:#1e7b34;--down:#d70015;--track:#e3e3e8;--seg:#fff;--grid:#e5e5ea;--axis:#6e6e73;--bad-bg:#ffe5e5;--bad-fg:#a3000f;
 --series-1:#007aff;--series-2:#b08800;--series-3:#8944ab;--series-4:#d30f45;--series-5:#0098b4;--series-6:#e8710a;
 --radius-bar:4px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--line:#38383a;--text:#f5f5f7;--muted:#98989d;
 --accent:#0a84ff;--hl:#0a2a52;--hover:#2c2c2e;--up:#30d158;--down:#ff6961;--track:#2c2c2e;--seg:#636366;--grid:#38383a;--axis:#98989d;
 --bad-bg:#3b0d0c;--bad-fg:#ff9f9a;--series-1:#0a84ff;--series-2:#b08800;--series-3:#d45bc8;--series-4:#ff375f;--series-5:#00a88f;--series-6:#e65c00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--line:#38383a;--text:#f5f5f7;--muted:#98989d;--accent:#0a84ff;--hl:#0a2a52;
 --hover:#2c2c2e;--up:#30d158;--down:#ff6961;--track:#2c2c2e;--seg:#636366;--grid:#38383a;--axis:#98989d;--bad-bg:#3b0d0c;--bad-fg:#ff9f9a;
 --series-1:#0a84ff;--series-2:#b08800;--series-3:#d45bc8;--series-4:#ff375f;--series-5:#00a88f;--series-6:#e65c00;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}main.wrap{display:grid;gap:16px;padding-top:16px;padding-bottom:32px}
.card{background:var(--card);border-radius:14px;padding:16px 18px;min-width:0}.chartbox{position:relative;height:300px}
.tools,.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sub,.stamp,.na{color:var(--muted)}a{color:var(--accent)}
.seg button[aria-pressed="true"]{font-weight:700}[data-theme-switch]{display:none}.banner.bad{background:var(--bad-bg);color:var(--bad-fg);padding:8px 12px}
}
</style>
<link rel="stylesheet" href="/~srs/themes/srs-default/v1/theme.css">
<script src="/~srs/themes/srs-default/v1/theme.js"></script>
<script>
/* Local preview (file:// or localhost): the theme comes from the html_preview proxy, which serves the repo's copy. */
if (location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname)) {
  const P = "http://127.0.0.1:8765/~srs/themes/srs-default/v1/", l = document.createElement("link"), s = document.createElement("script");
  l.rel = "stylesheet"; l.href = P + "theme.css"; s.src = P + "theme.js";
  document.head.append(l, s);
}
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
.chartbox{height:360px}
.ctls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ctl{display:inline-flex;align-items:center;gap:6px}
.card h2{margin:0}
.seg button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<header class="page-header"><div class="wrap">
  <div class="bar">
    <h1>Internet Web Traffic Tracker</h1>
    <div class="actions">
      <div class="seg" role="group" aria-label="Theme" data-theme-switch>
        <button type="button" data-theme-choice="auto">Auto</button><button type="button" data-theme-choice="light">Light</button><button type="button" data-theme-choice="dark">Dark</button>
      </div>
    </div>
  </div>
  <p class="sub">Similarweb desktop visits (WW), total, GenAI referrals and GenAI share, as trailing 7-day averages and Y/Y growth.</p>
  <div class="stamp" id="stamp">Data as of ...</div>
  <div id="banner" role="status"></div>
</div></header>
<main class="wrap">
  <section class="card" id="grouped-card" data-srs-section="grouped-traffic">
    <div class="tools"><h2 id="grouped-title">Grouped Traffic</h2>
      <div class="ctls" data-srs-hide>
        <span class="seg" role="group" aria-label="Category" id="cat"></span>
        <span class="seg" role="group" aria-label="Growth type" id="g_growth"></span>
        <span class="seg" role="group" aria-label="Traffic type" id="g_type"></span>
        <button type="button" class="btn" data-fs="grouped-card" aria-label="Full screen" title="Full screen">&#x2922;</button>
      </div></div>
    <div class="chartbox"><canvas id="grouped-chart" role="img" aria-label="Grouped traffic by domain"></canvas></div>
  </section>
  <section class="card" id="individual-card" data-srs-section="individual-traffic">
    <div class="tools"><h2 id="individual-title">Individual Traffic</h2>
      <div class="ctls" data-srs-hide>
        <span class="seg" role="group" aria-label="Domain" id="domain"></span>
        <span class="seg" role="group" aria-label="Growth type" id="i_growth"></span>
        <span class="seg" role="group" aria-label="Traffic type" id="i_type"></span>
        <button type="button" class="btn" data-fs="individual-card" aria-label="Full screen" title="Full screen">&#x2922;</button>
      </div></div>
    <div class="chartbox"><canvas id="individual-chart" role="img" aria-label="Individual domain traffic by year"></canvas></div>
  </section>
</main>
<footer class="wrap">
  <a href="./index.html.srsdoc">Source and method: see the documentation</a>
</footer>

<script>
"use strict";
const DATA_FILES = ["data.json"];
const DATA_FOLDER = "s3-browser/personal/fintan-creedon/internet-web-traffic-tracker/";   // local preview only
const GROWTH = [{key: "nominal", label: "Nominal"}, {key: "yoy", label: "Y/Y"}];
const TYPES = [{key: "genai", label: "GenAI"}, {key: "total", label: "Total"}, {key: "share", label: "Gen AI Share of Total"}];
const PARAMS = {cat: "otas", g_growth: "yoy", g_type: "genai", domain: "booking.com", i_growth: "nominal", i_type: "total"};
const DAY = 864e5;

/* ---- helpers ---- */
const $ = id => document.getElementById(id);
const isNum = v => typeof v === "number" && isFinite(v);
const fmt = (n, d = 0) => isNum(n) ? n.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d}) : "n/a";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const LOCAL = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
const dataUrl = f => LOCAL ? "http://127.0.0.1:8765/" + DATA_FOLDER + f : f;
function theme() {
  return {series: [1, 2, 3, 4, 5, 6].map(i => css("--series-" + i)), axis: css("--axis"), grid: css("--grid"),
    card: css("--card"), text: css("--text"), line: css("--line"), font: css("--font")};
}
function onThemeChange(fn) {
  window.addEventListener("srs:themechange", fn);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!window.SRSTheme) fn(); });
}
const iso = t => new Date(t).toISOString().slice(0, 10);
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dayLabel = s => +s.slice(8) + " " + MON[+s.slice(5, 7) - 1] + " " + s.slice(2, 4);
const compact = v => !isNum(v) ? "n/a" : Math.abs(v) >= 1e6 ? fmt(v / 1e6, 1) + "m" : Math.abs(v) >= 1e3 ? fmt(v / 1e3, 1) + "k" : fmt(v, 0);
const pct = (v, d = 0) => !isNum(v) ? "n/a" : (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v) * 100, d) + "%";
const share = (v, d = 1) => !isNum(v) ? "n/a" : fmt(v * 100, d) + "%";

/* ---- URL params ---- */
const URLQ = new URLSearchParams(location.search);
const getParam = k => URLQ.get(k) ?? PARAMS[k];
function setParam(k, v) {
  if (v == null || v === "" || String(v) === PARAMS[k]) URLQ.delete(k); else URLQ.set(k, v);
  const s = URLQ.toString();
  try { history.replaceState(null, "", location.pathname + (s ? "?" + s : "") + location.hash); } catch (e) {}
}

/* ---- full screen ---- */
function syncFs() {
  document.querySelectorAll("[data-fs]").forEach(b => {
    const box = $(b.dataset.fs), on = document.fullscreenElement === box || box.classList.contains("enlarged");
    b.setAttribute("aria-pressed", on); b.title = b.ariaLabel = on ? "Exit full screen (Esc)" : "Full screen";
  });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-fs]"); if (!b) return;
  const box = $(b.dataset.fs);
  if (document.fullscreenElement === box) document.exitFullscreen();
  else if (box.classList.contains("enlarged")) box.classList.remove("enlarged");
  else if (box.requestFullscreen) box.requestFullscreen().catch(() => { box.classList.add("enlarged"); syncFs(); });
  else box.classList.add("enlarged");
  syncFs();
});
document.addEventListener("fullscreenchange", syncFs);
document.addEventListener("keydown", e => { if (e.key === "Escape") { document.querySelectorAll(".enlarged").forEach(x => x.classList.remove("enlarged")); syncFs(); } });

function banner(msg, kind) { $("banner").innerHTML = '<div class="banner ' + kind + '">' + esc(msg) + "</div>"; }

async function loadData() {
  const parts = await Promise.all(DATA_FILES.map(async f => {
    const r = await fetch(dataUrl(f), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status + " fetching " + f);
    const j = await r.json();
    if (!j || typeof j !== "object" || Array.isArray(j)) throw new Error(f + " must be an object");
    if (!j.generated_at) throw new Error(f + " has no generated_at");
    return j;
  }));
  return Object.assign({}, ...parts);
}

/* ---- state ---- */
let D = null, dates = [], idx = {};
const state = {};
const charts = {}, hidden = {grouped: new Set(), individual: new Set()};
const valid = {
  cat: () => D.categories.map(c => c.key), domain: () => D.categories.flatMap(c => c.domains),
  g_growth: () => GROWTH.map(g => g.key), i_growth: () => GROWTH.map(g => g.key),
  g_type: () => TYPES.map(t => t.key), i_type: () => TYPES.map(t => t.key)};
const typeLabel = k => TYPES.find(t => t.key === k).label;
const growthLabel = k => k === "yoy" ? "Y/Y growth" : "nominal visits";
const field = g => g === "yoy" ? "yoy" : "tr7d";
/* Share is a level only: Y/Y is greyed out and the growth falls back to nominal. */
const mode = (type, growth) => type === "share" ? "share" : growth === "yoy" ? "yoy" : "visits";
const chartLabel = (type, growth) => type === "share" ? "Gen AI share of total visits" : typeLabel(type) + " " + growthLabel(growth);

/* A segmented control whose choice is mirrored in the URL. */
function seg(id, opts, onChange, disabled = () => false) {
  const draw = () => { $(id).innerHTML = opts.map(o => '<button type="button" data-v="' + esc(o.key) + '" aria-pressed="' +
    (o.key === state[id]) + '"' + (disabled(o.key) ? " disabled" : "") + ">" + esc(o.label) + "</button>").join(""); };
  draw();
  $(id).addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b || b.disabled) return;
    state[id] = b.dataset.v; setParam(id, state[id]); draw(); onChange(); });
  return draw;
}
/* A growth + type pair: picking Share forces Nominal and greys out Y/Y. */
function growthTypeSegs(g, t, render) {
  const fix = () => { if (state[t] === "share" && state[g] === "yoy") { state[g] = "nominal"; setParam(g, "nominal"); } };
  fix();
  const drawG = seg(g, GROWTH, render, k => k === "yoy" && state[t] === "share");
  seg(t, TYPES, () => { fix(); drawG(); render(); });
}

/* ---- charts ---- */
function lineChart(key, canvas, labels, sets, m, tickFmt) {
  if (!window.Chart) return;
  if (charts[key]) charts[key].destroy();
  const t = theme(), val = (v, d) => m === "yoy" ? pct(v, d) : m === "share" ? share(v, d + 1) : d ? fmt(v, 0) : compact(v);
  Chart.defaults.font.family = t.font;
  sets.forEach((s, i) => Object.assign(s, {borderColor: t.series[i], backgroundColor: t.series[i], borderWidth: 2,
    tension: .2, pointRadius: 0, pointHoverRadius: 4, spanGaps: false, hidden: hidden[key].has(s.label)}));
  charts[key] = new Chart($(canvas), {
    type: "line", data: {labels, datasets: sets},
    options: {responsive: true, maintainAspectRatio: false, animation: false,
      interaction: {mode: "index", intersect: false},
      plugins: {
        legend: {labels: {color: t.axis, usePointStyle: true, boxWidth: 8, boxHeight: 8},
          onClick(e, item, legend) {
            Chart.defaults.plugins.legend.onClick.call(this, e, item, legend);
            hidden[key][legend.chart.isDatasetVisible(item.datasetIndex) ? "delete" : "add"](item.text);
          },
          onHover: e => { e.native.target.style.cursor = "pointer"; }, onLeave: e => { e.native.target.style.cursor = ""; }},
        tooltip: {backgroundColor: t.card, titleColor: t.text, bodyColor: t.text, borderColor: t.line, borderWidth: 1,
          cornerRadius: 10, padding: 10, usePointStyle: true,
          callbacks: {title: c => tickFmt(labels[c[0].dataIndex], true),
            label: c => " " + c.dataset.label + ": " + val(c.parsed.y, 1)}}},
      scales: {
        x: {ticks: {color: t.axis, maxTicksLimit: 12, autoSkip: true, maxRotation: 0, callback: (v, i) => tickFmt(labels[i])},
            grid: {display: false}, border: {color: t.grid}},
        y: {ticks: {color: t.axis, callback: v => val(v, 0)}, grid: {color: t.grid}, border: {display: false}}}}
  });
}

/* Grouped: last 364 days to the latest date, one line per domain in the category. */
function renderGrouped() {
  const cat = D.categories.find(c => c.key === state.cat), f = field(state.g_growth);
  const from = Math.max(0, dates.length - 364), labels = dates.slice(from);
  const sets = cat.domains.map(d => ({label: d, data: D.series[d][state.g_type][f].slice(from)}));
  $("grouped-title").textContent = "Grouped Traffic: " + cat.label + ", " + chartLabel(state.g_type, state.g_growth) + " (TR7D)";
  lineChart("grouped", "grouped-chart", labels, sets, mode(state.g_type, state.g_growth), s => dayLabel(s));
}

/* Individual: Jan-Dec of the latest year; prior years shifted 364 / 728 days so weekdays line up. */
function renderIndividual() {
  const s = D.series[state.domain][state.i_type][field(state.i_growth)], yr = +D.end.slice(0, 4);
  const start = Date.UTC(yr, 0, 1), n = Math.round((Date.UTC(yr + 1, 0, 1) - start) / DAY);
  const labels = Array.from({length: n}, (_, i) => iso(start + i * DAY));
  const at = t => { const i = idx[iso(t)]; return i == null ? null : s[i]; };
  const sets = [0, 1, 2].map(k => ({label: String(yr - k),
    data: labels.map(l => { const t = Date.parse(l); return t > Date.parse(D.end) ? null : at(t - k * 364 * DAY); })}));
  $("individual-title").textContent = "Individual Traffic: " + state.domain + ", " + chartLabel(state.i_type, state.i_growth) + " (TR7D)";
  lineChart("individual", "individual-chart", labels, sets, mode(state.i_type, state.i_growth),
    (l, full) => full ? +l.slice(8) + " " + MON[+l.slice(5, 7) - 1] : MON[+l.slice(5, 7) - 1]);
}
function renderAll() { renderGrouped(); renderIndividual(); }
onThemeChange(renderAll);

/* ---- boot ---- */
(async () => {
  syncFs();
  try {
    D = await loadData();
    const t0 = Date.parse(D.start), t1 = Date.parse(D.end);
    for (let t = t0; t <= t1; t += DAY) { idx[iso(t)] = dates.length; dates.push(iso(t)); }
    Object.keys(PARAMS).forEach(k => { const v = getParam(k); state[k] = valid[k]().includes(v) ? v : PARAMS[k]; });
    seg("cat", D.categories.map(c => ({key: c.key, label: c.label})), renderGrouped);
    growthTypeSegs("g_growth", "g_type", renderGrouped);
    seg("domain", valid.domain().map(d => ({key: d, label: d})), renderIndividual);
    growthTypeSegs("i_growth", "i_type", renderIndividual);
    $("stamp").textContent = "Data through " + dayLabel(D.end) + " · built " + D.generated_at.replace("T", " ").slice(0, 16) + " UTC";
    if (!window.Chart) banner("Chart library unavailable.", "bad");
    renderAll();
  } catch (err) {
    banner("Could not load or read the data: " + err.message, "bad");
    $("stamp").textContent = "Data as of unknown";
  }
})();
</script>
</body>
</html>
